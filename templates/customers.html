{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}
<header class="page-header">
  <h1>Customers</h1>
  <div class="header-actions">
    <input type="search" id="search" placeholder="Search customers..." />
    <button type="button" class="btn btn-primary" id="btn-new">+ New customer</button>
  </div>
</header>
<div class="content-with-form">
  <section class="card table-card">
    <div id="customers-list" class="data-list"></div>
  </section>
  <aside class="form-panel hidden" id="form-panel">
    <div class="form-header">
      <h2 id="form-title">New customer</h2>
      <button type="button" class="btn-close" id="btn-close-form">&times;</button>
    </div>
    <form id="customer-form">
      <input type="hidden" id="customer-id" />
      <label>Name <span class="required">*</span><input type="text" id="name" required /></label>
      <label>Email<input type="email" id="email" /></label>
      <label>Phone<input type="tel" id="phone" /></label>
      <label>Address<textarea id="address" rows="2"></textarea></label>
      <label>Notes<textarea id="notes" rows="2"></textarea></label>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </aside>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='customers.js') }}"></script>
{% endblock %}
