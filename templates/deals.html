{% extends "base.html" %}
{% block title %}Deals{% endblock %}
{% block content %}
<header class="page-header">
  <h1>Deals pipeline</h1>
  <div class="header-actions">
    <select id="filter-stage">
      <option value="">All stages</option>
      <option value="quote">Quote</option>
      <option value="negotiation">Negotiation</option>
      <option value="won">Won</option>
      <option value="lost">Lost</option>
    </select>
    <button type="button" class="btn btn-primary" id="btn-new">+ New deal</button>
  </div>
</header>
<div class="content-with-form">
  <section class="card table-card">
    <div id="deals-list" class="data-list"></div>
  </section>
  <aside class="form-panel hidden" id="form-panel">
    <div class="form-header">
      <h2 id="form-title">New deal</h2>
      <button type="button" class="btn-close" id="btn-close-form">&times;</button>
    </div>
    <form id="deal-form">
      <input type="hidden" id="deal-id" />
      <label>Customer<select id="customer_id"><option value="">— Select —</option></select></label>
      <label>Lead<select id="lead_id"><option value="">— Select —</option></select></label>
      <label>Vehicle<select id="vehicle_id"><option value="">— Select —</option></select></label>
      <label>Stage
        <select id="stage">
          <option value="quote">Quote</option>
          <option value="negotiation">Negotiation</option>
          <option value="won">Won</option>
          <option value="lost">Lost</option>
        </select>
      </label>
      <label>Amount (€)<input type="number" id="amount" step="100" /></label>
      <label>Notes<textarea id="notes" rows="2"></textarea></label>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </aside>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='deals.js') }}"></script>
{% endblock %}
