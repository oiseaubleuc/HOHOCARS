{% extends "base.html" %}
{% block title %}Activities{% endblock %}
{% block content %}
<header class="page-header">
  <h1>Activities</h1>
  <div class="header-actions">
    <select id="filter-deal">
      <option value="">All deals</option>
    </select>
    <select id="filter-lead">
      <option value="">All leads</option>
    </select>
    <button type="button" class="btn btn-primary" id="btn-new">+ New activity</button>
  </div>
</header>
<div class="content-with-form">
  <section class="card table-card">
    <div id="activities-list" class="data-list"></div>
  </section>
  <aside class="form-panel hidden" id="form-panel">
    <div class="form-header">
      <h2 id="form-title">New activity</h2>
      <button type="button" class="btn-close" id="btn-close-form">&times;</button>
    </div>
    <form id="activity-form">
      <input type="hidden" id="activity-id" />
      <label>Deal<select id="deal_id"><option value="">— None —</option></select></label>
      <label>Lead<select id="lead_id"><option value="">— None —</option></select></label>
      <label>Type
        <select id="type">
          <option value="call">Call</option>
          <option value="email">Email</option>
          <option value="meeting">Meeting</option>
          <option value="test_drive">Test drive</option>
        </select>
      </label>
      <label>Description<textarea id="description" rows="2"></textarea></label>
      <label>Due date<input type="date" id="due_date" /></label>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </aside>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='activities.js') }}"></script>
{% endblock %}
