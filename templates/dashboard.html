{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<header class="page-header">
  <h1>Dashboard</h1>
</header>
<div class="dashboard">
  <section class="stats-grid" id="stats-grid"></section>
  <div class="dashboard-grid">
    <section class="card">
      <h2>Recent leads</h2>
      <div id="recent-leads" class="list-compact"></div>
    </section>
    <section class="card">
      <h2>Recent deals</h2>
      <div id="recent-deals" class="list-compact"></div>
    </section>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
{% endblock %}
